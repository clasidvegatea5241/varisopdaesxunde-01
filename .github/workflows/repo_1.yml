name: Repository 1 - Slot 1 (4:00 PM IST Target)
on:
  schedule:
    - cron: "30 9 * * *" # Starts with buffer, runs around Slot 1 (4:00 PM IST Target)
  workflow_dispatch:
    inputs:
      retry_attempt:
        description: 'Auto retry attempt count'
        required: false
        default: '0'

concurrency:
  group: daily-docker-1-${github.ref}
  cancel-in-progress: false

jobs:
  docker-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make script executable
        run: |
          chmod +x run.sh

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Matrix DB Bootstrapper (Dual-Mode: Web + Direct Atlas Fallback)"
        env:
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          MATRIX_DB_HOST: ${{ secrets.MATRIX_DB_HOST }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URI_1: ${{ secrets.MONGODB_URI_1 }}
          MONGODB_URI_2: ${{ secrets.MONGODB_URI_2 }}
          MONGODB_URI_3: ${{ secrets.MONGODB_URI_3 }}
          SESSION_MONGODB_URI: ${{ secrets.SESSION_MONGODB_URI }}
          SESSION_MONGODB_URI_1: ${{ secrets.SESSION_MONGODB_URI_1 }}
          SESSION_MONGODB_URI_2: ${{ secrets.SESSION_MONGODB_URI_2 }}
          SESSION_MONGODB_URI_3: ${{ secrets.SESSION_MONGODB_URI_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          USE_DIRECT_DB=false

          if [ -n "$MATRIX_DB_HOST" ] && [ "$MATRIX_DB_HOST" != "null" ]; then
            echo "Checking Matrix DB connectivity at $MATRIX_DB_HOST..."
            HTTP_STATUS=$(curl -s -o runner_env.json -w "%{http_code}" --connect-timeout 5 --max-time 10 \
              -H "Authorization: Bearer $ORCHESTRATOR_TOKEN" \
              "$MATRIX_DB_HOST/api/farm/runner-env?group=$GROUP_ID" || echo "000")

            if [ "$HTTP_STATUS" = "200" ] && [ -s runner_env.json ] && jq -e . runner_env.json >/dev/null 2>&1; then
              echo "✅ Matrix DB reachable (HTTP 200). Operating in Web Mode."
            else
              echo "⚠️ Matrix DB unavailable (HTTP $HTTP_STATUS). Falling back to Direct MongoDB Mode..."
              USE_DIRECT_DB=true
            fi
          else
            echo "[-] MATRIX_DB_HOST not set. Operating in Direct MongoDB Mode..."
            USE_DIRECT_DB=true
          fi

          if [ "$USE_DIRECT_DB" = "true" ]; then
            echo "Initializing Direct MongoDB Bootstrapper..."
            npm install --no-save mongodb
            node bootstrap-mongo.cjs 1
          else
            # Repo 1 is assigned to Slot 1. It only pulls ACCOUNT_1.
            IS_ACTIVE=$(jq -r '.is_active_1' runner_env.json)
            GROUP_ACTIVE=$(jq -r '.group_is_active' runner_env.json)
            EMAIL=$(jq -r '.account_1 // empty' runner_env.json)

            if [ "$IS_ACTIVE" = "false" ] || [ "$GROUP_ACTIVE" = "false" ] || [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ]; then
              echo "[-] Slot 1 is marked inactive or disabled in Matrix DB."
              echo "# Slot 1 is inactive" > .env
              jq '. + {inactive: true}' runner_env.json > runner_env.tmp && mv runner_env.tmp runner_env.json
            else
              echo "ACCOUNT_1_EMAIL=$EMAIL" >> .env
              echo "ACCOUNT_1_PASSWORD=$(jq -r .password_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_TOTP_SECRET=$(jq -r .totp_secret_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_RECOVERY_EMAIL=$(jq -r .recovery_email_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_GEO_LOCALE=$(jq -r .geo_locale_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_LANG_CODE=$(jq -r .lang_code_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_PROXY_HTTP=$(jq -r .proxy_http_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_PROXY_URL=$(jq -r .proxy_url_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_PROXY_PORT=$(jq -r .proxy_port_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_PROXY_USERNAME=$(jq -r .proxy_username_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_PROXY_PASSWORD=$(jq -r .proxy_password_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_SAVE_FINGERPRINT_MOBILE=$(jq -r .save_fingerprint_mobile_1 runner_env.json)" >> .env
              echo "ACCOUNT_1_SAVE_FINGERPRINT_DESKTOP=$(jq -r .save_fingerprint_desktop_1 runner_env.json)" >> .env
              MONGO_URI=$(jq -r .session_mongodb_uri runner_env.json)
              if [ "$MONGO_URI" != "null" ] && [ -n "$MONGO_URI" ]; then
                 echo "SESSION_MONGODB_URI=$MONGO_URI" >> .env
              fi
              DW_URL=$(jq -r .discord_webhook_url runner_env.json)
              if [ "$DW_URL" != "null" ] && [ -n "$DW_URL" ]; then
                 echo "CONFIG_DISCORD_ENABLED=true" >> .env
                 echo "CONFIG_DISCORD_URL=$DW_URL" >> .env
              fi

              echo "========================================="
              echo "  Currently loading data for SLOT 1"
              echo "========================================="
              echo "Successfully generated .env file from Matrix DB!"
            fi
          fi

      - name: Run Farm (V4)
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          WORKFLOW_FILE: "repo_1.yml"
        run: |
          ./run.sh 1

      - name: Log Run Status (Direct MongoDB Cloud Persistence)
        if: always()
        env:
          GROUP_ID: ${{ secrets.GROUP_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URI_1: ${{ secrets.MONGODB_URI_1 }}
          MONGODB_URI_2: ${{ secrets.MONGODB_URI_2 }}
          MONGODB_URI_3: ${{ secrets.MONGODB_URI_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f log-run-mongo.cjs ]; then
            node log-run-mongo.cjs 1 || echo "Logging to MongoDB completed with non-fatal warning."
          fi

      - name: Keep Repository Active (Prevent 60-Day Disable)
        if: always()
        env:
          # Configuration for Keepalive commit
          # 'always'   = Commit every single time the action runs (Great for testing!)
          # 'weekly'   = Commit once every 7 days
          # '25_days'  = Commit once every 25 days (Very safe buffer)
          # 'monthly'  = Commit once every 30 days
          # 'default'  = Commit once every 50 days (Cleanest history)
          KEEPALIVE_MODE: '25_days'
        run: |
          echo "Checking keepalive policy..."

          LAST_COMMIT_TS=$(git log -1 --format="%ct" || echo "0")
          CURRENT_TS=$(date +%s)
          DAYS_SINCE_COMMIT=$(( (CURRENT_TS - LAST_COMMIT_TS) / 86400 ))
          echo "Days since last commit: $DAYS_SINCE_COMMIT"

          SHOULD_COMMIT=false
          if [ "$KEEPALIVE_MODE" = "always" ]; then
            SHOULD_COMMIT=true
          elif [ "$KEEPALIVE_MODE" = "weekly" ] && [ "$DAYS_SINCE_COMMIT" -ge 7 ]; then
            SHOULD_COMMIT=true
          elif [ "$KEEPALIVE_MODE" = "25_days" ] && [ "$DAYS_SINCE_COMMIT" -ge 25 ]; then
            SHOULD_COMMIT=true
          elif [ "$KEEPALIVE_MODE" = "monthly" ] && [ "$DAYS_SINCE_COMMIT" -ge 30 ]; then
            SHOULD_COMMIT=true
          elif [ "$KEEPALIVE_MODE" = "default" ] && [ "$DAYS_SINCE_COMMIT" -ge 50 ]; then
            SHOULD_COMMIT=true
          fi

          if [ "$SHOULD_COMMIT" = "true" ]; then
            echo "Keepalive condition met. Creating automated commit..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github_keepalive

            git add .github_keepalive
            if git diff --staged --quiet; then
               echo "No changes to commit."
            else
               git commit -m "chore: automated keepalive commit to prevent workflow deactivation"
               git push
               echo "Keepalive commit pushed successfully."
            fi
          else
            echo "Keepalive condition not met (Mode: $KEEPALIVE_MODE). Skipping commit."
          fi
